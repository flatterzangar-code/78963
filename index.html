const regionSelect =
document.getElementById('regionSelect');

const districtSelect =
document.getElementById('districtSelect');

regionSelect.addEventListener('change',()=>{

const selectedRegion =
regionSelect.value;

districtSelect.innerHTML =
'<option value="">Ауданды таңдаңыз</option>';

if(districtData[selectedRegion]){

districtData[selectedRegion]
.forEach(district=>{

const option =
document.createElement('option');

option.value = district;
option.textContent = district;

districtSelect.appendChild(option);

});

}

});

const placeType =
document.getElementById('placeType');

const villageBox =
document.getElementById('villageBox');

const cityBox =
document.getElementById('cityBox');

villageBox.style.display = 'none';
cityBox.style.display = 'none';

placeType.addEventListener('change',()=>{

if(placeType.value === 'Ауыл'){

villageBox.style.display = 'block';
cityBox.style.display = 'none';

}

else if(placeType.value === 'Қала'){

cityBox.style.display = 'block';
villageBox.style.display = 'none';

}

else{

villageBox.style.display = 'none';
cityBox.style.display = 'none';

}

});
